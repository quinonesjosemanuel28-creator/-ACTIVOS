# Backup nocturno de la base de producción (Railway) + ensayo de restauración.
#
# Cada corrida hace TRES cosas, en este orden:
#   1. pg_dump de producción → backups/activos-FECHA.sql
#   2. ENSAYO: restaura ese mismo dump en un Postgres descartable del run,
#      corre las migraciones de la app encima y verifica fila por tabla
#      contra lo que el dump declara (npm run db:restaurar).
#   3. Sube el .sql como artifact del workflow (retención: 30 días).
#
# Si el ensayo falla, el workflow falla y GitHub avisa por mail: un backup
# que no se puede restaurar se detecta esa misma noche, no el día que se
# lo necesita.
#
# Requiere UN secreto del repo (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL — la URL pública de Postgres de Railway
#   (postgresql://postgres:CLAVE@xxxx.proxy.rlwy.net:PUERTO/railway)
name: Backup de producción

on:
  schedule:
    - cron: '0 6 * * *' # 03:00 Argentina (UTC-3), todas las noches
  workflow_dispatch: {} # y a mano, desde la pestaña Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # El Postgres descartable del ensayo, en la MISMA versión mayor que
      # producción (Railway corre 18): restaurar un dump de 18 en un server
      # más viejo falla, y ensayar contra otra versión no probaría nada.
      ensayo:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ensayo
          POSTGRES_DB: ensayo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Verificar que el secreto esté configurado
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::Falta el secreto BACKUP_DATABASE_URL (Settings → Secrets and variables → Actions). Sin él no hay backup."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El cliente 18 de PGDG: pg_dump se niega a volcar un server MAYOR que
      # él, y el runner trae el 16. Instalar el paquete no alcanza — hay que
      # poner su bin PRIMERO en el PATH, porque /usr/bin/pg_dump sigue
      # resolviendo al viejo (así falló el primer run: server 18.4 con
      # pg_dump 16.14).
      - name: Instalar cliente PostgreSQL 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSf -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          echo /usr/lib/postgresql/18/bin >> "$GITHUB_PATH"

      - name: Verificar que pg_dump sea el 18
        run: |
          which pg_dump psql
          pg_dump --version
          psql --version

      - name: Backup de producción (pg_dump, solo lectura)
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PGSSLMODE: require
        run: npm run db:backup

      - name: Ensayo de restauración (Postgres descartable del run)
        env:
          DATABASE_URL: postgresql://postgres:ensayo@localhost:5432/ensayo
        run: npm run db:restaurar -- backups/activos-*.sql

      - name: Guardar el backup (30 días)
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backups/*.sql
          retention-days: 30
          if-no-files-found: error
